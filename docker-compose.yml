services:
  web:
    build: .
    image: groc-price-compare:latest
    container_name: groc-web
    ports:
      # Host port configurable (serverpc0 already uses 3000 for open-webui); container stays 3000
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # 12B Gemma vLLM on serverpc1, reached over Tailscale (serverpc0 is on a different subnet)
      - LLM_BASE_URL=${LLM_BASE_URL:-http://100.66.130.112:8201/v1}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}
      - LLM_CONCURRENCY=${LLM_CONCURRENCY:-16}
      # Public path prefix when behind a Tailscale Funnel sub-path (e.g. /groc). Empty = root.
      - NEXT_PUBLIC_PATH_PREFIX=${PATH_PREFIX:-}
    command: npm run dev

  scraper:
    image: groc-price-compare:latest
    container_name: groc-scraper
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - LLM_BASE_URL=${LLM_BASE_URL:-http://100.66.130.112:8201/v1}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}
      - SKIP_PANDAMART=${SKIP_PANDAMART:-1}
      - SCRAPE_CONCURRENCY=${SCRAPE_CONCURRENCY:-8}
    profiles: ["tools"]
    command: npm run scrape
